<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demand Modelling</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #5f6b7d;
    --border: #d5dae2;
    --hit: #d62839;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13161c;
      --panel: #1b1f27;
      --text: #e6e9ef;
      --muted: #9aa4b4;
      --border: #333a46;
      --hit: #ef4655;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .disclaimer { color: var(--hit); font-weight: 800; font-size: 0.8em; margin-left: 10px; white-space: nowrap; }
  .panels { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  figure {
    flex: 1 1 400px;
    margin: 0;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  figcaption { font-size: 1.1rem; font-weight: 600; margin: 0 0 12px; }
  figure img { display: block; width: 100%; height: auto; margin: 0 auto; max-width: 600px; }
</style>
</head>
<body>
<main>
  <h1>Demand Modelling <span class="disclaimer">FOR DEMONSTRATION PURPOSES ONLY</span></h1>
  <div class="panels">
    <figure>
      <figcaption>Modelled CFS demand - 7 days</figcaption>
      <img src="demand_week.gif" alt="Modelled CFS demand over 7 days" width="432" height="498">
    </figure>
    <figure>
      <figcaption>Modelled truck territory</figcaption>
      <img src="shift_seed42_5trucks.gif" alt="Modelled truck territory" width="432" height="553">
    </figure>
  </div>
</main>
</body>
</html>
